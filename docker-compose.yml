services:
  enderecamento:
    build: .
    container_name: enderecamento-shopper-local
    ports:
      - "8001:8000"
    environment:
      MB_USER: ${MB_USER:-}
      MB_PASS: ${MB_PASS:-}
      MB_SESSION_ID: ${MB_SESSION_ID:-}
      APPS_SCRIPT_WEBHOOK_TOKEN: ${APPS_SCRIPT_WEBHOOK_TOKEN:-}
    volumes:
      - ./.credentials:/app/.credentials
    restart: unless-stopped
