<!DOCTYPE html>
<html lang="pt-BR" data-dse-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Endereçamento — Shopper</title>
  <!-- Plus Jakarta Sans — premium, legível, moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shopper-static/_ds/shopper-design-system-93bf5de4-604a-4bef-87d7-ff5f60287723/colors_and_type.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; overflow: hidden; }

    /* ── Tipografia premium ── */
    body {
      font-family: 'Plus Jakarta Sans', var(--font-sans), system-ui, sans-serif;
      font-size: 13px;
      font-feature-settings: 'kern' 1, 'liga' 1, 'calt' 1;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes dse-spin { to { transform: rotate(360deg); } }
    @keyframes dse-highlight-pulse {
      0%, 100% { outline-color: #EF4444; }
      50% { outline-color: rgba(239,68,68,0.18); }
    }
    @keyframes dse-fade-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Peer highlight: escaninhos com o mesmo produto que o hovado */
    .dse-peer-hovered {
      outline: 1px solid var(--cc, rgba(59,130,246,0.6)) !important;
      outline-offset: -1px;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--cc, #3B82F6) 40%, transparent),
                  0 0 0 1px color-mix(in srgb, var(--cc, #3B82F6) 50%, transparent) !important;
      z-index: 2;
    }

    /* ── Light theme — "Warm Studio" ── */
    :root, [data-dse-theme="light"] {
      --app-bg:             #F0EBE1;
      --shopper-navy:       #0F2B1A;

      --cfg-surface:        #FDFAF6;
      --cfg-border:         #DDD8CE;
      --cfg-text:           #1C1914;
      --cfg-text-muted:     #776D5E;
      --cfg-input-bg:       #F7F3EE;

      --map-bg:             #E7E1D6;
      --map-equip-bg:       #FDFAF6;
      --map-equip-shadow:   0 1px 3px rgba(28,25,20,0.08), 0 0 0 1px rgba(28,25,20,0.05);
      --map-equip-header:   #F2EDE6;
      --map-geladeira-hdr:  #EAF0F9;
      --map-gerador-hdr:    #FEF8E8;
      --map-freezer-hdr:    #E6F4F8;
      --map-quimico-hdr:    #FAE9E9;
      --map-text:           #2A2318;
      --map-text-muted:     #9A9080;

      --pran-bg:            #F7F3EE;
      --pran-border:        #DDD8CE;
      --pran-text:          #1C1914;
      --pran-muted:         #9A9080;
      --pran-input:         #FDFAF6;
      --pran-hover:         rgba(28,25,20,0.04);

      --panel-bg:           #FDFAF6;
      --panel-border:       #DDD8CE;
      --panel-text:         #1C1914;
      --panel-muted:        #9A9080;
      --panel-surface:      #F7F3EE;

      --dropdown-bg:        #FDFAF6;
      --dropdown-border:    #DDD8CE;
      --dropdown-text:      #1C1914;
      --dropdown-hover:     #EDE8E0;
    }

    /* ── Dark theme — "Obsidian Craft" (inspirado em Impeccable + taste-skill) ── */
    [data-dse-theme="dark"] {
      --app-bg:             #0B0B09;
      --shopper-navy:       #0D1F12;

      --cfg-surface:        #131310;
      --cfg-border:         rgba(255,255,255,0.08);
      --cfg-text:           #F0EDE8;
      --cfg-text-muted:     #635F59;
      --cfg-input-bg:       #0F0F0D;

      --map-bg:             #0D0D0B;
      --map-equip-bg:       #161613;
      --map-equip-shadow:   0 2px 12px rgba(0,0,0,0.55),
                            0 0 0 1px rgba(255,255,255,0.05),
                            inset 0 1px 0 rgba(255,255,255,0.04);
      --map-equip-header:   #1C1C19;
      --map-geladeira-hdr:  #0C141E;
      --map-gerador-hdr:    #181300;
      --map-freezer-hdr:    #091318;
      --map-quimico-hdr:    #180808;
      --map-text:           #E8E3DC;
      --map-text-muted:     #4A4740;

      --pran-bg:            #0F0F0D;
      --pran-border:        rgba(255,255,255,0.07);
      --pran-text:          #F0EDE8;
      --pran-muted:         #635F59;
      --pran-input:         #131310;
      --pran-hover:         rgba(255,255,255,0.04);

      --panel-bg:           #131310;
      --panel-border:       rgba(255,255,255,0.07);
      --panel-text:         #F0EDE8;
      --panel-muted:        #635F59;
      --panel-surface:      #0F0F0D;

      --dropdown-bg:        #1C1C19;
      --dropdown-border:    rgba(255,255,255,0.09);
      --dropdown-text:      #F0EDE8;
      --dropdown-hover:     rgba(255,255,255,0.06);
    }

    /* ── Scrollbars refinados ── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(148,163,184,0.18);
      border-radius: 2px;
      transition: background 0.2s;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,0.35); }
    [data-dse-theme="dark"] ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }
    [data-dse-theme="dark"] ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* Transição só nos elementos de UI — nunca no mapa (causaria lag nos 2100+ escaninhos) */
    button, input, select, textarea, [role="button"] {
      transition: background-color 0.15s ease, border-color 0.15s ease,
                  color 0.1s ease, opacity 0.15s ease;
    }

    /* ── Double-bezel nos dropdowns (taste-skill) ── */
    [data-dse-theme="dark"] [style*="var(--dropdown-bg)"],
    [data-dse-theme="dark"] [style*="dropdown-bg"] {
      box-shadow: 0 12px 40px rgba(0,0,0,0.6),
                  0 0 0 1px rgba(255,255,255,0.06),
                  inset 0 1px 0 rgba(255,255,255,0.07) !important;
    }

    /* ── Feedback de interação ── */
    button:active:not(:disabled) { transform: scale(0.97); }

    /* Input focus */
    input:focus, select:focus { outline: 1px solid var(--shopper-green) !important; }
    input[type="checkbox"] { accent-color: var(--shopper-green); }
    input[type="date"] { color-scheme: light; }
    [data-dse-theme="dark"] input[type="date"] { color-scheme: dark; }
    select { appearance: auto; }
    [data-dse-theme="dark"] select { color-scheme: dark; }

    /* ── Animação de entrada nos paineis ── */
    #root > * { animation: dse-fade-in 0.22s ease; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Data (no JSX) -->
  <script src="/shopper-static/dse-data.js"></script>

  <!-- Components (JSX via Babel) -->
  <script type="text/babel" src="/shopper-static/tweaks-panel.jsx"></script>
  <script type="text/babel" src="/shopper-static/dse-config.jsx"></script>
  <script type="text/babel" src="/shopper-static/dse-escaninho.jsx"></script>
  <script type="text/babel" src="/shopper-static/dse-map.jsx"></script>
  <script type="text/babel" src="/shopper-static/dse-prancheta.jsx"></script>
  <script type="text/babel" src="/shopper-static/dse-panels.jsx"></script>
  <script type="text/babel" src="/shopper-static/dse-app.jsx"></script>
</body>
</html>
